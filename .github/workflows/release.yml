name: Build and Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publish to GitHub Release"
        required: false
        type: boolean
        default: true

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  windows:
    name: Build Windows x64
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Windows package (Installer & ZIP)
        run: npm run package:win

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: open-typora-windows-x64
          path: |
            release/windows/*-Setup.exe
            release/windows/*.zip
            release/windows/SHA256SUMS-windows-x64.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish or Update GitHub Release
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') || inputs.publish_release == true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v${VERSION}"
          TITLE="Open Typora ${TAG} (Windows 增强版)"
          
          NOTES=$(cat << 'EOF'
          ## 🚀 Open Typora 魔改增强版

          基于开源项目进行深度痛点重构，带来丝滑顺手的写作与文件管理体验。

          ### ✨ 核心增强功能 (v0.7.6)
          1. **🖱️ 正文编辑区原生右键菜单 (对齐 Typora 原版，丝滑排版)**：
             - 彻底解决正文内容右击死寂无反应的痛点，右键即享原生 Windows 极速上下文菜单；
             - **剪贴板全能力**：剪切 (Ctrl+X)、复制 (Ctrl+C)、粘贴 (Ctrl+V)、粘贴为纯文本 (Ctrl+Shift+V)、复制为 Markdown (Ctrl+Shift+C)；
             - **插入子菜单 (Insert)**：插入表格 (Ctrl+T)、代码块 (Ctrl+Shift+K)、公式块 (Ctrl+Shift+M)、超链接 (Ctrl+K)、图片 (Ctrl+Shift+I)、水平分割线、引用、内容目录 (TOC)；
             - **格式子菜单 (Format)**：加粗 (Ctrl+B)、斜体 (Ctrl+I)、下划线 (Ctrl+U)、删除线、行内代码、高亮、清除格式；
             - **段落子菜单 (Paragraph)**：一级~六级标题 (Ctrl+1~6)、普通段落 (Ctrl+0)、提升/降低级别、列表、任务列表、在上方/下方插入段落；
             - **智能表格感应**：当光标处于表格内部时自动呼出表格专有操作（增删行列、对齐方式、删除表格）；
             - **查找与全选**：快速呼出查找替换 (Ctrl+F) 与全选 (Ctrl+A)。
          2. **🧼 侧栏底端工具栏清爽重构 (权责分明，告别混杂)**：
             - 彻底剥离原本突兀混杂在底栏的“粗体”、“斜体”、“代码块”以及长篇文本编辑冗余，文本格式彻底归于正文右键；
             - 底栏聚焦纯正的全局工作区与系统操作：新建、打开、快速打开、保存、另存为、查找、文件夹搜索、专注模式、导出 PDF/HTML、偏好设置、明暗主题等。
          3. **🧭 默认大纲视图首选 & 视图记忆 (v0.7.5)**：
             - 贴合高频写作排版习惯，启动应用或打开文档时默认优先展示“文档大纲”；
             - 自动通过本地存储（localStorage）记住用户的侧边栏切换偏好，无需每次手动切换。
          4. **🎛️ 顶部平铺分段式切换器 (Segmented Control)**：
             - 彻底告别原版遮挡视线、操作繁琐的下拉浮动弹窗；
             - 侧边栏顶部直接平铺胶囊式分段切换按钮（`[ 📑 大纲 | 🌲 树状 | 📄 列表 ]`），零遮挡、零跳转，点击一键即达。
          5. **📖 大纲去“AI味”深度重构 (还原 Typora 原版书卷质感)**：
             - **剔除 AI 模板化徽章**：彻底移除大纲中生硬突兀的 `H1` / `H2` 药丸色块徽标（badge spam），视觉回归宁静克制；
             - **章节层级折叠展开 (Collapsible Headings)**：完美复刻 Typora 原版的章节折叠能力，悬浮显示微型展开折叠指示箭头，点击折叠父章节时自动递归收拢其下所有子标题；
             - **层次字阶与活动指示条**：H1~H6 层次分明（精调字阶梯、字重与颜色明暗），左侧搭配细腻的竖向当前章节活动指示条。
          6. **💡 新建草稿保存智能命名 (对齐 Typora 原版体验)**：
             - 彻底告别无脑弹出 `未命名.md` 的痛点；
             - 首次保存未命名草稿时，自动智能解析正文首个 Markdown 标题（`# 标题`）或首段有效文字作为保存文件名建议；
             - 严格自动过滤操作系统非法文件名字符（`\ / : * ? " < > |` 及换行控制符），防呆截断安全长度；
             - 自动联动已打开的工作区文件夹，默认定位在当前工程内，回车即保存。
          7. **⌨️ 快捷键肌肉记忆对齐**：
             - 纠正 `Ctrl+W` 误杀窗口问题（现已精准映射为关闭当前文档标签，`Ctrl+Shift+W` 关闭窗口）；
             - `Ctrl+T` 还原为 Typora 核心的“插入表格”功能；
             - 补齐常用格式快捷键：`Ctrl+Shift+K`（代码块）、`Ctrl+Shift+M`（公式块）、`Ctrl+Shift+I`（插入图片）；
             - 新增标签切换神技：支持 `Ctrl+Tab`（向右）与 `Ctrl+Shift+Tab`（向左）快速循环切换打开的标签页。
          8. **📑 顶部文档多标签栏原生右键增强**：
             - 右键标签呼出 Windows 原生菜单；
             - 支持「关闭标签页」、「关闭其他标签页」、「关闭已保存标签页」；
             - 本地文件快捷支持「复制文件路径」、「在文件资源管理器中显示」；
             - 支持未保存状态 `●` 脏标记提示与鼠标中键单击关闭。
          9. **🧭 文档大纲视口滚动跟随 (ScrollSpy)**：
             - 阅读或编辑长文档时，左侧文档大纲实时感知正文视口并动态高亮跟随当前所在章节；
             - 光标跳转与点击章节时，大纲自动平滑滚入可见视野。
          10. **📂 全局拖拽秒开与工作区识别**：将任意 `.md` 文件或文件夹直接拖入窗口瞬间加载。
          11. **🎨 主题生态兼容与原生右键菜单**：完美支持迁移的 Typora 原版暗黑主题与图片内嵌，原生极速右键上下文菜单。

          ### 📦 下载说明
          - **安装版**：下载 `*-Setup.exe` 双击安装。
          - **免安装便携版**：下载 `*.zip` 解压即可直接运行。
          EOF
          )

          echo "Checking release for $TAG..."
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG exists, updating assets..."
            gh release upload "$TAG" release/windows/*-Setup.exe release/windows/*.zip release/windows/SHA256SUMS-windows-x64.txt --clobber
          else
            echo "Creating new release $TAG..."
            gh release create "$TAG" release/windows/*-Setup.exe release/windows/*.zip release/windows/SHA256SUMS-windows-x64.txt \
              --title "$TITLE" \
              --notes "$NOTES"
          fi

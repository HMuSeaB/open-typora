name: Build and Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publish to GitHub Release"
        required: false
        type: boolean
        default: true

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  windows:
    name: Build Windows x64
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Windows package (Installer & ZIP)
        run: npm run package:win

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: open-typora-windows-x64
          path: |
            release/windows/*-Setup.exe
            release/windows/*.zip
            release/windows/SHA256SUMS-windows-x64.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish or Update GitHub Release
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') || inputs.publish_release == true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v${VERSION}"
          TITLE="Open Typora ${TAG} (Windows 增强版)"
          
          NOTES=$(cat << 'EOF'
          ## 🚀 Open Typora 魔改增强版

          基于开源项目进行深度痛点重构，带来丝滑顺手的写作与文件管理体验。

          ### ✨ 核心增强功能
          1. **📂 全局拖拽秒开**：将任意 `.md` 文件或整个目录直接拖入窗口，瞬间打开并载入。
          2. **📁 目录与工作区识别**：支持直接通过外部参数识别文件夹并无缝加载侧边栏文件树。
          3. **📑 顶部文档多标签栏 (Document Tabs Bar)**：
             - 类似 VS Code / Chrome 的标签体验；
             - 实时展示当前打开的所有文档；
             - 支持未保存状态 `●` 脏标记提示；
             - 支持鼠标中键一键关闭、右侧一键新建草稿。
          4. **⚡ 快捷跳转优化**：快速打开文件快捷键统一映射为行业通用的 `Ctrl+P`。
          5. **🎨 主题生态兼容**：完美支持迁移的 Typora 原版暗黑主题与图片内嵌。

          ### 📦 下载说明
          - **安装版**：下载 `*-Setup.exe` 双击安装。
          - **免安装便携版**：下载 `*.zip` 解压即可直接运行。
          EOF
          )

          echo "Checking release for $TAG..."
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG exists, updating assets..."
            gh release upload "$TAG" release/windows/*-Setup.exe release/windows/*.zip release/windows/SHA256SUMS-windows-x64.txt --clobber
          else
            echo "Creating new release $TAG..."
            gh release create "$TAG" release/windows/*-Setup.exe release/windows/*.zip release/windows/SHA256SUMS-windows-x64.txt \
              --title "$TITLE" \
              --notes "$NOTES"
          fi

name: Build and Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publish to GitHub Release"
        required: false
        type: boolean
        default: true

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  windows:
    name: Build Windows x64
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Windows package (Installer & ZIP)
        run: npm run package:win

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: open-typora-windows-x64
          path: |
            release/windows/*-Setup.exe
            release/windows/*.zip
            release/windows/SHA256SUMS-windows-x64.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish or Update GitHub Release
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') || inputs.publish_release == true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v${VERSION}"
          TITLE="Open Typora ${TAG} (Windows 增强版)"
          
          NOTES=$(cat << 'EOF'
          ## 🚀 Open Typora 魔改增强版

          基于开源项目进行深度痛点重构，带来丝滑顺手的写作与文件管理体验。

          ### ✨ 核心增强功能 (v0.7.4)
          1. **💡 新建草稿保存智能命名 (对齐 Typora 原版体验)**：
             - 彻底告别无脑弹出 `未命名.md` 的痛点；
             - 首次保存未命名草稿时，自动智能解析正文首个 Markdown 标题（`# 标题`）或首段有效文字作为保存文件名建议；
             - 严格自动过滤操作系统非法文件名字符（`\ / : * ? " < > |` 及换行控制符），防呆截断安全长度；
             - 自动联动已打开的工作区文件夹，默认定位在当前工程内，回车即保存。
          2. **⌨️ 快捷键肌肉记忆对齐**：
             - 纠正 `Ctrl+W` 误杀窗口问题（现已精准映射为关闭当前文档标签，`Ctrl+Shift+W` 关闭窗口）；
             - `Ctrl+T` 还原为 Typora 核心的“插入表格”功能；
             - 补齐常用格式快捷键：`Ctrl+Shift+K`（代码块）、`Ctrl+Shift+M`（公式块）、`Ctrl+Shift+I`（插入图片）；
             - 新增标签切换神技：支持 `Ctrl+Tab`（向右）与 `Ctrl+Shift+Tab`（向左）快速循环切换打开的标签页。
          2. **📑 顶部文档多标签栏原生右键增强**：
             - 右键标签呼出 Windows 原生菜单；
             - 支持「关闭标签页」、「关闭其他标签页」、「关闭已保存标签页」；
             - 本地文件快捷支持「复制文件路径」、「在文件资源管理器中显示」；
             - 支持未保存状态 `●` 脏标记提示与鼠标中键单击关闭。
          3. **🧭 文档大纲视口滚动跟随 (ScrollSpy)**：
             - 阅读或编辑长文档时，左侧文档大纲实时感知正文视口并动态高亮跟随当前所在章节；
             - 光标跳转与点击章节时，大纲自动平滑滚入可见视野。
          4. **📂 全局拖拽秒开与工作区识别**：将任意 `.md` 文件或文件夹直接拖入窗口瞬间加载。
          5. **🎨 主题生态兼容与右键美化**：完美支持迁移的 Typora 原版暗黑主题与图片内嵌，修复侧边栏下拉遮挡。

          ### 📦 下载说明
          - **安装版**：下载 `*-Setup.exe` 双击安装。
          - **免安装便携版**：下载 `*.zip` 解压即可直接运行。
          EOF
          )

          echo "Checking release for $TAG..."
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG exists, updating assets..."
            gh release upload "$TAG" release/windows/*-Setup.exe release/windows/*.zip release/windows/SHA256SUMS-windows-x64.txt --clobber
          else
            echo "Creating new release $TAG..."
            gh release create "$TAG" release/windows/*-Setup.exe release/windows/*.zip release/windows/SHA256SUMS-windows-x64.txt \
              --title "$TITLE" \
              --notes "$NOTES"
          fi
